name: Prune Vercel deployments

on:
  workflow_dispatch:
    inputs:
      days:
        description: Delete preview deployments older than this many days
        required: true
        default: "14"
        type: string
      dry_run:
        description: List candidates only (no deletions)
        required: true
        default: true
        type: boolean

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Prune old preview deployments
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT: rai1903web
        run: |
          ARGS="--days ${{ inputs.days }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          else
            ARGS="$ARGS --yes"
          fi
          npx tsx scripts/prune-vercel-deployments.ts $ARGS
